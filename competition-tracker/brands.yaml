# Une marque = un objet. Ajouter une marque ici ne nécessite aucune
# modification de code.
#
# scraper_type:
#   static_html  -> scrapers/static.py (requests + BeautifulSoup)
#   js_widget    -> scrapers/dynamic.py (JSON API du widget si possible, sinon Playwright)
#   manual       -> pas de scraper, chiffre à obtenir par email/vérification humaine
#
# confidence (repris tel quel dans le rapport, cf. aggregate.py):
#   haute    -> scraper statique fiable, filtre FSS testé et propre
#   moyenne  -> scraper fonctionne mais filtre mono-marque/wholesale approximatif
#   manuelle -> pas de scraper fiable

- name: "Diptyque"
  slug: diptyque
  store_locator_url: "https://stores.diptyqueparis.com/en_us/all-addresses"
  scraper_type: static_html
  parser: diptyque
  confidence: haute
  notes: >
    Page "all-addresses" donne directement un total par pays sous 4 blocs
    régionaux (Europe / Middle East / Asia / North America) - pas besoin
    d'extraire chaque adresse individuellement.

- name: "Maison Francis Kurkdjian"
  slug: mfk
  store_locator_url: "https://www.franciskurkdjian.com/int-en/storelocator"
  scraper_type: static_html
  parser: mfk
  confidence: moyenne
  known_total: 21
  notes: >
    Salesforce Commerce Cloud, liste server-rendue (<li class="core-storelocator-item">)
    mais mélange boutiques MFK et revendeurs multi-marques (parfumeries indépendantes,
    grands magasins, duty free) - filtre par mot-clé sur le nom de la boutique
    + known_retailers_blocklist.json. Pas de champ pays direct (seulement
    ville + code postal) : le pays est déduit d'une table ville->pays repérée
    à la main pour les boutiques MFK connues ; toute boutique non reconnue part
    dans _a_verifier.csv plutôt que d'être classée au hasard.

- name: "Juliette Has A Gun"
  slug: jhag
  store_locator_url: "https://www.juliettehasagun.com/en/pages/store-locator"
  scraper_type: js_widget
  parser: stockist
  stockist_widget_tag: "u6705"
  confidence: moyenne
  notes: >
    Widget Stockist (pas de scraping DOM/Playwright nécessaire) : le tag
    "u6705" trouvé dans le HTML (data-stockist-widget-tag) permet d'appeler
    directement https://stockist.co/api/v1/u6705/locations/search avec un
    quadrillage de coordonnées (latitude/longitude/radius) pour couvrir le
    monde. Mélange boutiques JHAG et revendeurs (Sephora...) - même filtre
    nom-de-marque que MFK. Le champ "country" renvoyé par l'API est parfois
    vide -> fallback ville/code postal comme pour MFK.

