# Curated industry/luxury/beauty/travel-retail news sources for the
# recent-openings discovery workflow (see NEW OBJECTIVE in the project's
# working instructions). These complement, never replace, official brand
# sources - see SOURCE_CATEGORIES / SOURCE_PRIORITY below.
#
# This file is a reference list only: nothing in this repository crawls
# these sites live (no search API key, no scraper for each site - see
# online_research.py's module docstring for why research is a curated
# cache, not a live search). It documents WHERE a human (or a Claude Code
# session with web search access, done out-of-band) should look when
# filling data/online_research_cache.json, and gives recent_openings.py a
# simple, deterministic SOURCE_PRIORITY to rank cached findings by.
#
# SOURCE_CATEGORIES: OFFICIAL_BRAND | OFFICIAL_MALL_OR_LANDLORD |
#   INDUSTRY_NEWS | LUXURY_NEWS | BEAUTY_NEWS | TRAVEL_RETAIL_NEWS |
#   LINKEDIN | OTHER
#
# SOURCE_PRIORITY (simple deterministic tiers, no scoring formula):
#   1 = official brand website/newsroom/LinkedIn/store locator, official
#       mall or landlord source
#   2 = FashionNetwork, The Business of Fashion, Vogue Business, The Moodie
#       Davitt Report, TRBusiness, Global Travel Retail Magazine, Global
#       Cosmetics News, Cosmetics Business, Global Cosmetics Industry,
#       Retail in Asia
#   3 = Journal du Luxe, CPP-LUXURY.COM, The Fragrance Foundation, Retail
#       Beauty, Retail Scope

sources:
  - name: "FashionNetwork"
    website: "https://www.fashionnetwork.com"
    linkedin: "https://www.linkedin.com/company/fashionnetwork-com/"
    category: INDUSTRY_NEWS
    priority: 2
    geographic_focus: global
    covers_travel_retail: false
    covers_luxury: true
    covers_beauty_fragrance: true
    search_method: "site search + site:fashionnetwork.com web search"
    notes: >
      Broad fashion/retail trade press, frequently covers store openings
      and brand expansion news across regions.

  - name: "The Moodie Davitt Report"
    website: "https://moodiedavittreport.com"
    linkedin: "https://www.linkedin.com/company/the-moodie-davitt-report/"
    category: TRAVEL_RETAIL_NEWS
    priority: 2
    geographic_focus: global
    covers_travel_retail: true
    covers_luxury: true
    covers_beauty_fragrance: true
    search_method: "site search + site:moodiedavittreport.com web search"
    notes: >
      The reference trade title for travel retail/duty-free - airport and
      downtown duty-free boutique openings, not FSS/FSF by the BIBLE
      definition unless explicitly a free-standing mono-brand boutique.

  - name: "TRBusiness"
    website: "https://www.trbusiness.com"
    linkedin: "https://www.linkedin.com/company/trbusiness/"
    category: TRAVEL_RETAIL_NEWS
    priority: 2
    geographic_focus: global
    covers_travel_retail: true
    covers_luxury: true
    covers_beauty_fragrance: true
    search_method: "site search + site:trbusiness.com web search"
    notes: "Travel Retail Business - duty-free/airport retail trade press."

